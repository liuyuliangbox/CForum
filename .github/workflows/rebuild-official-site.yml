name: Rebuild Official Site

# Rebuilds liuyuliangbox/Gaming-Community (Workers + Assets → game.aridjaya.eu.org)
# after syncing forum export into static /logs.
on:
  schedule:
    - cron: '0 2 * * *'
  workflow_dispatch:

jobs:
  rebuild:
    runs-on: ubuntu-latest
    name: Sync forum + deploy game site
    steps:
      - name: Checkout Gaming-Community
        uses: actions/checkout@v4
        with:
          repository: liuyuliangbox/Gaming-Community
          ref: main

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install and build
        env:
          FORUM_API_BASE: https://bbs.aridjaya.eu.org
        run: |
          npm ci
          npm run build

      - name: Deploy gaming-community Worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
        run: npx wrangler@4 deploy
